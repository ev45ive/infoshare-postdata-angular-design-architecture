  if(d.free){const left=Math.max(g.area.x,Math.min(...g.boxes.map(b=>b.r.x))),right=Math.min(g.area.right,Math.max(...g.boxes.map(b=>b.r.right))),top=Math.max(g.area.y,Math.min(...g.boxes.map(b=>b.r.y))),bottom=Math.min(g.area.bottom,Math.max(...g.boxes.map(b=>b.r.bottom)));const shade=(x,y,width,height)=>{if(width>.5&&height>.5)out.push(`<div class="free-region" style="left:${x-o.x}px;top:${y-o.y}px;width:${width}px;height:${height}px"></div>`);};shade(g.area.x,g.area.y,left-g.area.x,g.area.height);shade(right,g.area.y,g.area.right-right,g.area.height);shade(left,g.area.y,right-left,top-g.area.y);shade(left,bottom,right-left,g.area.bottom-bottom);if(g.model.context==='flex'&&g.cs.flexWrap==='nowrap'){const horizontal=axesFor(g.cs).main.axis==='x',ordered=g.boxes.map(b=>b.r).sort((a,b)=>horizontal?a.x-b.x:a.y-b.y);for(let i=1;i<ordered.length;i++){const a=ordered[i-1],b=ordered[i];if(horizontal)shade(a.right,g.area.y,b.x-a.right,g.area.height);else shade(g.area.x,a.bottom,g.area.width,b.y-a.bottom);}}}
  if(state.active==='b'&&s.centerGuide)line(g.area.x+g.area.width/2,g.parent.y-10,g.parent.height+20,true,'Toolbar center','center');
  if(state.active==='b'&&s.elementCenters)for(const b of g.boxes)line(b.r.x+b.r.width/2,b.r.y,b.r.height,true,'Group '+b.el.dataset.entity,'center');
  if(state.active==='c'&&s.centers)for(const b of g.boxes)line(b.r.x,b.r.y+b.r.height/2,b.r.width,false,Number(b.el.dataset.entity)===Number(s.selected)?'Box center':'','center');
  if(state.active==='c'&&s.baselines){for(const b of g.boxes){const first=b.el.querySelector('.baseline-marker.first'),lasts=b.el.querySelectorAll('.baseline-marker.last'),last=lasts[lasts.length-1];if(first){const f=rect(first),l=last?rect(last):f,picked=Number(b.el.dataset.entity)===Number(s.selected);line(b.r.x,f.y,b.r.width,false,picked?'First text probe':'','baseline');if(Math.abs(l.y-f.y)>.5)line(b.r.x,l.y,b.r.width,false,picked?'Last text probe':'','baseline');}}}
  if(d.overflow&&Math.max(...Object.values(g.overflow))>.5){const bounds={x:Math.min(g.area.x,...g.boxes.map(b=>b.r.x)),y:Math.min(g.area.y,...g.boxes.map(b=>b.r.y)),right:Math.max(g.area.right,...g.boxes.map(b=>b.r.right)),bottom:Math.max(g.area.bottom,...g.boxes.map(b=>b.r.bottom))};box({...bounds,width:bounds.right-bounds.x,height:bounds.bottom-bounds.y},'Unclipped box extent');}
  $('overlay').innerHTML=out.join('');
 }
};
// Event routing preserves control DOM; ranges update on input, discrete controls on change.
$('demo-shell').addEventListener('input',event=>{const node=event.target;if(!node.dataset.control||node.type!=='range')return;dispatch({type:'control',key:node.dataset.control,value:Number(node.value)});});
$('demo-shell').addEventListener('change',event=>{const node=event.target;if(node.dataset.control){const def=controls[state.active].find(c=>c.key===node.dataset.control);if(def.type==='range')return;let value=def.type==='checkbox'?node.checked:node.value;if(def.key==='selected')value=Number(value);dispatch({type:'control',key:def.key,value});}else if(node.dataset.diagnostic)dispatch({type:'diagnostic',key:node.dataset.diagnostic,value:node.checked});else if(node.id==='stage-select')dispatch({type:'stage',index:Number(node.value)});else if(node.id==='inspect-property')dispatch({type:'inspect',value:node.value});});
$('demo-shell').addEventListener('click',event=>{const node=event.target.closest('button,[data-entity]');if(!node)return;if(node.dataset.tab)dispatch({type:'tab',key:node.dataset.tab});else if(node.dataset.mode)dispatch({type:'mode',value:node.dataset.mode});else if(node.dataset.case)dispatch({type:'case',index:Number(node.dataset.case)});else if(node.dataset.entity)dispatch({type:'selected',index:Number(node.dataset.entity)});else if(node.id==='previous')dispatch({type:'stage',index:current().step-1});else if(node.id==='next')dispatch({type:'stage',index:current().step+1});else if(node.id==='reset')dispatch({type:'reset'});else if(node.id==='remember')dispatch({type:'remember'});else if(node.id==='clear-remembered')dispatch({type:'clear-reference'});else if(node.id==='copy')copyCSS();});
document.querySelector('.lab-tabs').addEventListener('keydown',event=>{const keys=['a','b','c','d'],i=keys.indexOf(state.active);let next;if(event.key==='ArrowRight')next=keys[(i+1)%4];if(event.key==='ArrowLeft')next=keys[(i+3)%4];if(event.key==='Home')next='a';if(event.key==='End')next='d';if(next){event.preventDefault();dispatch({type:'tab',key:next});$('tab-'+next).focus();}});
$('world').addEventListener('keydown',event=>{const node=event.target.closest('[data-entity]');if(node&&event.target===node&&(event.key==='Enter'||event.key===' ')){event.preventDefault();dispatch({type:'selected',index:Number(node.dataset.entity)});}});
async function copyCSS(){let copied=false;try{await navigator.clipboard.writeText(cssText);copied=true;}catch{const active=document.activeElement,area=document.createElement('textarea');area.value=cssText;area.style.cssText='position:fixed;left:-10000px;top:0';document.body.append(area);area.select();copied=document.execCommand('copy');area.remove();active?.focus();}$('copy').textContent=copied?'Copied':'Select CSS to copy';}
addEventListener('resize',scheduleMeasure);$('world-scroll').addEventListener('scroll',scheduleMeasure,{passive:true});
new ResizeObserver(scheduleMeasure).observe($('world'));document.fonts.ready.then(scheduleMeasure);
buildControls();render();

<script>
(() => {
  'use strict';
  const root = document.querySelector('#demo-shell');
  const $ = (id) => root.querySelector('#' + id);
  const $$ = (selector) => [...root.querySelectorAll(selector)];
  const INLINE_STAGES = [
    {label:'1. Plain text and inline elements',hint:'Resize the feed. Predict where the status fragment ends.',question:'When available width becomes smaller, does the status span become a new box or continue in the line?',choices:['It stays part of inline formatting','It becomes a block'],answer:'It stays part of inline formatting.',why:'An inline span participates inside line boxes. Its text can continue on the next line; it does not establish a block boundary.'},
    {label:'2. Inline decoration',hint:'Add decoration while the label crosses a line.',question:'Does padding or a border make the label atomic?',choices:['No — it can still fragment','Yes — decoration prevents splitting'],answer:'No — it can still fragment.',why:'Inline decoration paints around each inline fragment. Vertical padding and borders affect the visual line area, but do not change outer display participation.'},
    {label:'3. Wrapping constraints',hint:'Use the long label or ID, then compare rules.',question:'Which rule protects a multiword label as one unit but risks overflow?',choices:['white-space: nowrap','overflow-wrap: anywhere','word-break: break-all'],answer:'white-space: nowrap.',why:'nowrap prevents regular wrap opportunities. anywhere creates extra opportunities only when needed; break-all can split ordinary words at arbitrary positions.'},
    {label:'4. Atomic elements',hint:'Compare inline with inline-block at a narrow width.',question:'What changes when a status becomes inline-block?',choices:['It wraps as one atomic box','It still fragments by line'],answer:'It wraps as one atomic box.',why:'inline-block has an inline outer display, so it sits in a line, and a flow-root-like internal formatting context. Its own box cannot split between lines; if it is wider than the line, it overflows.'},
    {label:'5. Display participation',hint:'Compare outer participation with width behavior.',question:'Which choice keeps the element block-level but lets its width follow its content?',choices:['block + width: fit-content','inline','inline-block'],answer:'block + width: fit-content.',why:'Display answers how the box participates outside; width answers how a block is sized. The two-value idea names both dimensions: inline flow and block flow are outer participation, while flow describes internal formatting.'}
  ];
  const BLOCK_STAGES = [
    {label:'1. width:auto; height:auto',hint:'Start with the ordinary block formatting contract.',question:'For an ordinary in-flow block with width:auto, what determines its used inline size?',choices:['Available parent space','Only its text width'],answer:'Available parent space.',why:'In normal block flow, an auto width is resolved from the containing block and surrounding box-model values. It is not a content-sized pill.'},
    {label:'2. Parent width changes',hint:'Change the containing block, not the card declaration.',question:'When the parent narrows, which dimension changes first?',choices:['The card’s available width','Its intrinsic content'],answer:'The card’s available width.',why:'The containing block supplies available inline space. The card’s auto width follows that space; text reflows afterwards.'},
    {label:'3. Content-driven height',hint:'Add activity details without fixing height.',question:'With height:auto, what makes the panel taller?',choices:['Its laid-out content','The parent width alone'],answer:'Its laid-out content.',why:'The block’s height is content-driven in this setup. A narrower parent may indirectly add lines, but the used block height comes from the laid-out contents.'},
    {label:'4. Width contracts',hint:'Compare auto, 100%, and a fixed width.',question:'Which mode names a fixed content-box width before box-sizing changes it?',choices:['360px','auto','100%'],answer:'360px.',why:'A fixed length is a stronger contract than auto or percentage. A percentage resolves from the containing block, while auto follows the block formatting algorithm.'},
    {label:'5. Occupied space',hint:'Add padding, border, and margin.',question:'Which measurement includes the margins outside the border?',choices:['Occupied width','Border-box width'],answer:'Occupied width.',why:'Content, padding, border, and margins are separate regions. The browser exposes the element border box directly; occupied space adds the used margins.'},
    {label:'6. First sizing conflict',hint:'Use 100% with padding and compare box-sizing.',question:'Why can content-box + width:100% exceed the parent?',choices:['Padding and border are added outside declared width','100% includes all boxes'],answer:'Padding and border are added outside declared width.',why:'With content-box, width controls only the content box. border-box moves padding and border inside the declared width, which is often the first reason this property matters.'},
    {label:'7. Fixed height and overflow',hint:'Set 120px and add long content.',question:'What decision remains after content no longer fits?',choices:['How overflow is handled','Whether auto width is used'],answer:'How overflow is handled.',why:'A fixed height creates a conflict with content. visible, hidden, and auto describe different consequences; none makes the content disappear from the layout model.'},
    {label:'8. Next question',hint:'Keep the dimensions fixed and inspect the regions.',question:'Which next topic explains why these regions have different visual and layout effects?',choices:['The box model','Flexbox alignment'],answer:'The box model.',why:'Section 2 can inspect the content, padding, border, and margin regions in more detail. This demo only establishes why their distinction matters.'}
  ];
  const DEFAULTS = {inline:{mode:'explore',stage:0,width:360,sample:'normal',padding:0,border:0,whiteSpace:'normal',breaking:'normal',display:'inline',previewWidth:'auto',inspector:false,reveal:false,prediction:null},block:{mode:'explore',stage:0,parentWidth:500,content:'medium',width:'auto',padding:16,border:1,margin:0,boxSizing:'content-box',height:'auto',overflow:'visible',previewWidth:'auto',inspector:false,reveal:false,prediction:null}};
  let state = {demo:'inline', inline:structuredClone(DEFAULTS.inline), block:structuredClone(DEFAULTS.block)};
  const inlineSamples = {normal:{pre:'Maya Patel moved ',status:'Contract review',post:' to Legal after the discovery call with Northwind Ventures.',secondary:'Nora left a note: “Keep the executive summary short.”'},long:{pre:'Maya Patel changed the next step to ',status:'Needs executive alignment before procurement',post:' after the account review with Northwind Ventures.',secondary:'The label is plausible when a CRM workflow carries a detailed state.'},id:{pre:'Maya Patel linked ',status:'DEAL20261018WESTERNENTERPRISEUPGRADE',post:' to the expansion opportunity after the call.',secondary:'This identifier intentionally has no ordinary wrap opportunity.'}};

  }
  function mountInline(s){

  }
  function mountBlock(s){
    const widthValue=s.width==='auto'?'auto':s.width==='full'?'100%':'360px';
    const heightValue=s.height==='fixed'?'120px':'auto';
    const note=dealNotes[s.content];
    $('world').innerHTML=`<div class="crm-app"><div class="crm-topbar"><b>Deal summary</b><span>Qualified · $180,000</span></div><div class="deal-parent" id="deal-parent" style="width:${s.parentWidth}px"><div class="deal-parent-label"><span>Containing block</span><span>${s.parentWidth}px declared</span></div><article class="deal-card" id="deal-card" style="width:${widthValue};height:${heightValue};padding:${s.padding}px;border-width:${s.border}px;margin-inline:${s.margin}px;box-sizing:${s.boxSizing};overflow:${s.overflow}"><header class="deal-head"><h3>Northwind expansion</h3><p>Owner: Maya Patel · Closing this quarter</p></header><div class="deal-grid"><div class="deal-field"><span>Stage</span><b>Negotiation</b></div><div class="deal-field"><span>Forecast</span><b>Upside</b></div></div><p class="deal-note">${note}</p></article></div><div class="sizing-readout"><div><span>Declared width</span><b>${widthValue}</b></div><div><span>Declared height</span><b>${heightValue}</b></div><div><span>Box sizing</span><b>${s.boxSizing}</b></div></div><p class="two-value"><b>Next:</b> Which box-model region changes visible size, available content space, or outer occupied space?</p></div>`;

  }
  function measureInline(node,parent){

  }
  function measureBlock(node,parent){

    const marginL=parseFloat(cs.marginLeft),marginR=parseFloat(cs.marginRight),padX=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight),borderX=parseFloat(cs.borderLeftWidth)+parseFloat(cs.borderRightWidth),padY=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom),borderY=parseFloat(cs.borderTopWidth)+parseFloat(cs.borderBottomWidth);
    const available=Math.max(0,parent.clientWidth-parseFloat(parentCs.paddingLeft)-parseFloat(parentCs.paddingRight));

    return {kind:'block',display:cs.display,declared:cs.width,borderW:rect.width,contentW:Math.max(0,rect.width-padX-borderX),borderH:rect.height,contentH:Math.max(0,rect.height-padY-borderY),occupied,available,boxSizing:cs.boxSizing,overflowX:node.scrollWidth>node.clientWidth||occupied>available+1,overflowY:node.scrollHeight>node.clientHeight,overflow:cs.overflow};
  }
  function renderInspector(m){
    const open=current().inspector;if(!open)return;

  }
  function updateControls(s){
    const maxStage=s.mode==='explore'?Infinity:s.stage;
    $$('.demo-inline').forEach(el=>el.hidden=state.demo!=='inline'||Number(el.dataset.showStage)>maxStage);
    $$('.demo-block').forEach(el=>el.hidden=state.demo!=='block'||Number(el.dataset.showStage)>maxStage);

      'inline-width':['width','val-inline-width',v=>px(v)],'inline-sample':['sample'], 'inline-padding':['padding','val-inline-padding',v=>px(v)],'inline-border':['border','val-inline-border',v=>px(v)],'inline-white-space':['whiteSpace'],'inline-break':['breaking'],'inline-display':['display'],
      'parent-width':['parentWidth','val-parent-width',v=>px(v)],'deal-content':['content'],'deal-width':['width'],'deal-padding':['padding','val-deal-padding',v=>px(v)],'deal-border':['border','val-deal-border',v=>px(v)],'deal-margin':['margin','val-deal-margin',v=>px(v)],'deal-box-sizing':['boxSizing'],'deal-height':['height'],'deal-overflow':['overflow']};

  }
  const inputMap={
    'inline-width':'width','inline-sample':'sample','inline-padding':'padding','inline-border':'border','inline-white-space':'whiteSpace','inline-break':'breaking','inline-display':'display',
    'parent-width':'parentWidth','deal-content':'content','deal-width':'width','deal-padding':'padding','deal-border':'border','deal-margin':'margin','deal-box-sizing':'boxSizing','deal-height':'height','deal-overflow':'overflow'};
  root.addEventListener('input',(event)=>{const key=inputMap[event.target.id];if(key)dispatch({type:'set',key,value:event.target.type==='range'?Number(event.target.value):event.target.value});});
  root.addEventListener('change',(event)=>{const key=inputMap[event.target.id];if(key&&event.target.type!=='range')dispatch({type:'set',key,value:event.target.value});if(event.target.id==='preview-width')dispatch({type:'set',key:'previewWidth',value:event.target.value});});

edia-box').textContent=`${px(ir.width)} × ${px(ir.height)}`;$('#card-box').textContent=`${px(cr.width)} × ${px(cr.height)}`;rows.push(metric('Rendered image',`${px(ir.width)} × ${px(ir.height)}`),metric('Media frame',`${px(mr.width)} × ${px(mr.height)}`),metric('Whole card',`${px(cr.width)} × ${px(cr.height)}`));}cause=`Object fitting changes how the source object is drawn inside its content box; it does not rewrite the card box.`}if(state.demo==='d'){const d=state.d;cause=d.experiment==='d1'?'Active mechanism: the target itself is sized at min-content.':d.experiment==='d2'?`Active mechanism: flex primary item uses min-width:${d.flexMin==='zero'?'0':'auto'}.`:`Active mechanism: grid template is ${d.gridMode==='minmax'?'minmax(0, 1fr) auto':'1fr auto'}${d.gridItemMin?' with grid-item min-width:0':''}.`;}
  if(state.inspectorOpen){$('#measurements').innerHTML=rows.join('');$('#cause').textContent=cause;}
  if(state.compare){const result=$('#compare-result');if(result){let alternative='';if(state.demo==='a')alternative=`same content with width:fit-content`;if(state.demo==='b')alternative=`same panel with width:min(100%, 520px)`;if(state.demo==='c')alternative=`same image with object-fit:contain`;if(state.demo==='d')alternative=state.d.experiment==='d2'?'same flex fixture with min-width:0':state.d.experiment==='d3'?'same grid fixture with minmax(0,1fr)':'same identifier with overflow-wrap:anywhere';result.textContent=`Current rendered target: ${px(rect.width)} × ${px(rect.height)}; overflow: ${overflowX||overflowY?'yes':'no'}. Alternative to test: ${alternative}.`;}}
}
function render(){const active=document.activeElement;const focusId=active&&active.id;$('#app').innerHTML=shell();requestAnimationFrame(()=>{updateMeasurement();if(focusId){const el=document.getElementById(focusId);if(el)el.focus({preventScroll:true})}})}
function control(path,value,type){if(path==='previewWidth'){state.previewWidth=value;render();return}const [group,key]=path.split('.');if(!key)return;let next=value;if(type==='checkbox')next=Boolean(value);else if(type==='range')next=Number(value);state[group][key]=next;if(path==='b.context'){state.b.parentWidth={wide:760,split:520,sidebar:340,embedded:280}[next];}render()}
function dispatch(action,value){if(action==='demo'){state.demo=value;state.stage=0;render();return}if(action==='mode'){state.mode=value;render();return}if(action==='next'||action==='previous'){stageApply(state.demo,state.stage+(action==='next'?1:-1));render();return}if(action==='toggleInspector'){state.inspectorOpen=!state.inspectorOpen;render();return}if(action==='toggleCss'){state.cssOpen=!state.cssOpen;render();return}if(action==='compare'){state.compare=!state.compare;render();return}if(action==='reset'){const priorDemo=state.demo;state=defaults();state.demo=priorDemo;render();return}}
document.addEventListener('input',event=>{const el=event.target;if(el.dataset.control&&el.type==='range')control(el.dataset.control,el.value,'range')});
document.addEventListener('change',event=>{const el=event.target;if(!el.dataset.control)return;control(el.dataset.control,el.type==='checkbox'?el.checked:el.value,el.type)});
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(button)dispatch(button.dataset.action,button.dataset.value);const tab=event.target.closest('button[data-control][data-value]');if(tab)control(tab.dataset.control,tab.dataset.value,'select')});
render();
})();
</script>
</body>
</html>

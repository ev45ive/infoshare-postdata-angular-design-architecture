<title>CSS Layout &amp; Sizing · Section 4 — Flexbox</title>
<style id="shell-style">
/* DEMOSHELL 1.0 — Keep shell chrome and tokens consistent across all demos.
   Customize only the lesson/world content in .ds-world and the registries in JS. */
#demo-shell {
  --shell-bg:#FFFFFF;--shell-side:#F7F9FC;--shell-work:#EEF2F8;
  --shell-ink:#25344B;--shell-muted:#64758D;--shell-subtle:#8897AA;
  --shell-border:#D8E0E9;--shell-accent:#315FA8;--shell-accent-soft:#E8F0FD;
  --shell-warning:#98631B;--shell-warning-bg:#FFF2DB;
  --shell-danger:#A54747;--shell-success:#287963;--shell-code:#152338;
  --shell-radius-xs:4px;--shell-radius-sm:6px;--shell-radius-md:9px;--shell-radius-lg:12px;
  --shell-gap-1:4px;--shell-gap-2:8px;--shell-gap-3:12px;--shell-gap-4:16px;--shell-gap-5:24px;
  --shell-font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font:13px/1.5 var(--shell-font); color:var(--shell-ink);background:var(--shell-bg);
  border:1px solid var(--shell-border);border-radius:var(--shell-radius-lg);
  max-width:1420px;margin:16px auto;overflow:hidden; box-shadow:0 5px 24px #24344a0a;
}
#demo-shell *,#demo-shell *::before,#demo-shell *::after{box-sizing:border-box}
#demo-shell button,#demo-shell select,#demo-shell input{font:inherit}
#demo-shell button{cursor:pointer}
#demo-shell button:focus-visible,#demo-shell input:focus-visible,#demo-shell select:focus-visible{outline:2px solid var(--shell-accent);outline-offset:2px}
#demo-shell button:disabled{opacity:.5;cursor:default}
#demo-shell .ds-header{min-height:64px;background:#17263D;color:#F6F9FF;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px}
#demo-shell h1{font-size:16px;line-height:1.15;letter-spacing:-.3px;margin:0;font-weight:700}
#demo-shell .ds-kicker{font-size:11px;color:#A8B8D0;margin-top:4px}
#demo-shell .ds-status{border:1px solid #5F7390;border-radius:6px;color:#ECF4FF;font-size:11px;white-space:nowrap;padding:5px 9px}
#demo-shell .ds-columns{display:grid;grid-template-columns:304px minmax(0,1fr);min-height:690px}
#demo-shell .ds-sidebar{background:var(--shell-side);padding:14px;border-right:1px solid var(--shell-border);display:flex;flex-direction:column;gap:13px;max-height:820px;overflow:auto}
#demo-shell .ds-section{border-bottom:1px solid var(--shell-border);padding-bottom:13px;min-width:0}
#demo-shell .ds-section:last-child{border-bottom:0;padding-bottom:0}
#demo-shell .ds-section-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;margin:0 0 9px}
#demo-shell .ds-meta{font-size:11px;color:var(--shell-muted);font-weight:400}
#demo-shell .ds-label{font-size:11px;color:var(--shell-muted);display:block}
#demo-shell .ds-hint{font-size:11px;color:var(--shell-muted);margin:7px 0 0}
#demo-shell .ds-seg{display:flex;background:#FFF;border:1px solid var(--shell-border);border-radius:6px;overflow:hidden;min-width:0}
#demo-shell .ds-seg button{flex:1;border:0;border-right:1px solid var(--shell-border);color:#52647C;background:transparent;min-height:32px;font-size:11px;padding:5px 6px}
#demo-shell .ds-seg button:last-child{border:0}
#demo-shell .ds-seg button[aria-pressed="true"]{background:var(--shell-accent);color:#FFF;font-weight:650}
#demo-shell .ds-mini-actions{display:flex;align-items:center;gap:7px;margin:9px 0 5px}
#demo-shell .ds-btn{min-height:32px;border-radius:6px;border:1px solid var(--shell-border);color:#435771;background:white;padding:6px 10px;font-size:11px;font-weight:600}
#demo-shell .ds-btn-primary{background:var(--shell-accent);color:white;border-color:var(--shell-accent)}
#demo-shell .ds-btn-block{width:100%}
#demo-shell .ds-step{flex:1;text-align:center;font-size:11px;color:var(--shell-muted)}
#demo-shell .ds-field{margin:10px 0}
#demo-shell .ds-fieldrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
#demo-shell output{font-size:11px;color:var(--shell-accent);font-variant-numeric:tabular-nums}
#demo-shell input[type="range"]{width:100%;accent-color:var(--shell-accent);cursor:pointer;display:block;margin:3px 0;height:18px}
#demo-shell input[type="checkbox"]{width:15px;height:15px;accent-color:var(--shell-accent);cursor:pointer;margin:0}
#demo-shell .ds-all{display:flex;align-items:center;gap:9px;font-weight:700;font-size:11px;padding:5px 0 9px}
#demo-shell .ds-problem{display:grid;grid-template-columns:20px minmax(0,1fr) 22px;gap:7px;align-items:center;border-radius:6px;border:1px solid transparent;padding:5px;margin:0 -5px}
#demo-shell .ds-problem[data-selected="true"]{background:var(--shell-accent-soft);border-color:#BED1F3}
#demo-shell .ds-problem button{border:0;background:none;color:var(--shell-ink);text-align:left;font-size:11px;min-height:28px;padding:0}
#demo-shell .ds-issue-icon{font-size:11px;color:var(--shell-warning);text-align:center}
#demo-shell .ds-inspector{border:1px solid var(--shell-border);border-radius:9px;background:white;padding:10px}
#demo-shell .ds-inspect-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:700}
#demo-shell .ds-pill{display:inline-block;border-radius:6px;background:var(--shell-warning-bg);color:var(--shell-warning);font-size:10px;padding:3px 6px;font-weight:600}
#demo-shell .ds-pill.ok{color:var(--shell-success);background:#E6F4ED}
#demo-shell .ds-chain{display:grid;grid-template-columns:85px minmax(0,1fr);gap:5px 9px;margin:10px 0;font-size:11px}
#demo-shell .ds-chain dt{color:var(--shell-subtle)}
#demo-shell .ds-chain dd{margin:0;min-width:0;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px}
#demo-shell .ds-compare-values{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:9px 0}
#demo-shell .ds-value{background:#F2F5F9;border-radius:6px;padding:8px;min-width:0}
#demo-shell .ds-value label{display:block;color:var(--shell-muted);font-size:10px}
#demo-shell .ds-value b{font-size:12px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
#demo-shell .ds-explain{font-size:11px;color:#586B84;margin:9px 0}
#demo-shell .ds-workspace{background:var(--shell-work);min-width:0;display:flex;flex-direction:column}
#demo-shell .ds-toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 15px;border-bottom:1px solid var(--shell-border)}
#demo-shell .ds-toolbar strong{font-size:12px}
#demo-shell .ds-toolbar-group{display:flex;align-items:center;gap:8px}
#demo-shell select{height:32px;border:1px solid var(--shell-border);border-radius:6px;color:var(--shell-ink);background:white;padding:0 7px;font-size:11px;max-width:100%}
#demo-shell .ds-stage{border-radius:6px;padding:7px 15px;font-size:11px;color:#546780;border-bottom:1px solid var(--shell-border);background:#F7F9FD}
#demo-shell .ds-world-wrap{padding:16px;min-width:0;overflow:auto}
#demo-shell .ds-world{background:#FFF;border:1px solid var(--shell-border);border-radius:9px;max-width:100%;width:100%;padding:16px;min-height:410px;margin:0 auto;transition:background .12s}
#demo-shell .ds-world-heading{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
#demo-shell .ds-world h2{font-size:17px;margin:0;line-height:1.25}
#demo-shell .ds-world p{font-size:11px;color:var(--shell-muted);margin:4px 0 0}
#demo-shell .ds-world-badge{background:#EDF4FF;color:#2F5F9D;padding:4px 9px;border-radius:6px;font-weight:650;font-size:10px}
#demo-shell .ds-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
#demo-shell .ds-metric{border:1px solid var(--shell-border);border-radius:9px;background:white;padding:11px;min-width:0;text-align:left;cursor:pointer;color:var(--shell-ink)}
#demo-shell .ds-metric span{color:var(--shell-muted);display:block;font-size:11px}
#demo-shell .ds-metric strong{font-size:22px;display:block;font-variant-numeric:tabular-nums;white-space:nowrap}
#demo-shell .ds-metric small{color:var(--shell-muted);font-size:10px}
#demo-shell [data-entity].selected{outline:2px solid var(--shell-accent);outline-offset:2px}
#demo-shell .ds-chart{border:1px solid var(--shell-border);border-radius:9px;padding:13px;margin-top:12px}
#demo-shell .ds-chart-label{display:flex;justify-content:space-between;font-size:11px;font-weight:650;gap:10px;margin-bottom:7px}
#demo-shell .ds-bars{display:flex;align-items:end;gap:4px;height:120px;background:linear-gradient(to top,#E6ECF5 1px,transparent 1px) 0 0/100% 30px}
#demo-shell .ds-bars div{flex:1;min-width:3px;min-height:0;border-radius:3px 3px 0 0;background:#6E9BD6;transition:height .12s}
#demo-shell .ds-bars div:last-child{background:var(--shell-accent)}
#demo-shell .ds-axis{display:flex;justify-content:space-between;color:var(--shell-subtle);font-size:10px;margin-top:6px}
#demo-shell .ds-question{border-left:3px solid var(--shell-accent);background:#F1F5FB;padding:9px 12px;margin-top:12px;border-radius:0 6px 6px 0}
#demo-shell .ds-question strong{font-size:11px}
#demo-shell .ds-question p{font-size:11px;color:var(--shell-ink)}
#demo-shell .ds-compare-panel{border:1px solid #C6D9F6;border-radius:9px;background:#F2F7FF;padding:10px 12px;margin-top:10px;font-size:11px}
#demo-shell .ds-compare-panel strong{display:block;font-size:12px;margin-bottom:3px}
#demo-shell .ds-bottom{background:#FFF;border-top:1px solid var(--shell-border);padding:13px 16px}
#demo-shell .ds-bottom-title{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:700;margin-bottom:9px}
#demo-shell .ds-code{white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto;background:var(--shell-code);color:#E6ECF7;padding:13px;border-radius:6px;font:11px/1.55 ui-monospace,Consolas,monospace;margin:9px 0 0}
#demo-shell .ds-footer-note{font-size:11px;color:var(--shell-muted);padding:9px 16px;background:#FAFCFE;border-top:1px solid var(--shell-border)}
@media(max-width:800px){#demo-shell .ds-columns{grid-template-columns:minmax(0,1fr)}#demo-shell .ds-sidebar{max-height:none;border-right:0;border-bottom:1px solid var(--shell-border)}#demo-shell .ds-world-wrap{padding:10px}}
@media(max-width:430px){#demo-shell{margin:0}#demo-shell .ds-metrics{grid-template-columns:1fr}#demo-shell .ds-world{padding:10px}#demo-shell .ds-header{padding:10px}#demo-shell .ds-metric strong{font-size:19px}}
@media(prefers-reduced-motion:reduce){#demo-shell *,#demo-shell *::before,#demo-shell *::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<main id="demo-shell">
 <header class="ds-header"><div><h1>CSS Layout &amp; Sizing · Flexbox</h1><div class="ds-kicker" id="lab-title"></div></div><nav class="lab-nav" aria-label="Flexbox labs"><button data-lab="a" aria-pressed="true">4A · Sizing</button><button data-lab="b" aria-pressed="false">4B · Workspace</button><button data-lab="c" aria-pressed="false">4C · Wrapping</button><button data-lab="d" aria-pressed="false">4D · Cards</button></nav><span id="status" class="ds-status">Explore</span></header>
 <div class="ds-columns">
  <aside class="ds-sidebar" aria-label="Lesson controls">

 $('overlay').innerHTML=tags.join('');

/* 8. Event wiring. A single delegated state path handles native keyboard and pointer inputs. */
$('demo-shell').addEventListener('input',event=>{const el=event.target;if(el.dataset.control&&el.type==='range')handleControl(el);});
$('demo-shell').addEventListener('change',event=>{
 const el=event.target;
 if(el.dataset.control&&el.type!=='range')handleControl(el);
 else if(el.id==='stage-select')dispatch({type:'stage',value:Number(el.value)});
 else if(el.id==='inspect-target')dispatch({type:'inspect',value:el.value});
 else if(el.id.startsWith('show-'))dispatch({type:'observe',key:el.id.slice(5),value:el.checked});
});
function handleControl(el){const def=activeSchemas.find(def=>def.key===el.dataset.control);if(!def)return;dispatch({type:'set',key:def.key,value:el.type==='checkbox'?el.checked:el.value,item:def.item,kind:def.kind,min:def.min,max:def.max});}
$('demo-shell').addEventListener('click',event=>{
 const button=event.target.closest('button');
 if(button?.dataset.lab){dispatch({type:'lab',value:button.dataset.lab});return;}
 if(button?.dataset.mode){dispatch({type:'mode',value:button.dataset.mode});return;}
 if(button?.id==='previous'||button?.id==='next'){dispatch({type:'stage',value:state.stage[state.lab]+(button.id==='next'?1:-1)});return;}
 if(button?.id==='reset'){dispatch({type:'reset'});return;}
 if(button?.id==='restore-stage'){dispatch({type:'restore'});return;}
 if(button?.id==='repair'){dispatch({type:'repair'});$('feedback').textContent='Applied the stage’s alternative. Inspect the declarations and compare the result.';return;}
 if(button?.dataset.deal!==undefined){dispatch({type:'set',key:'deal',value:Number(button.dataset.deal)});$('feedback').textContent='Selected '+deals[current().deal].name+'.';return;}
 if(button?.dataset.nav){qa('[data-nav]').forEach(el=>el.setAttribute('aria-pressed',String(el===button)));$('feedback').textContent=button.dataset.nav+' selected in the workspace sketch.';return;}
 if(button?.dataset.previewAction){
  const action=button.dataset.previewAction;
  if(action==='clear'&&state.lab==='c'){dispatch({type:'set',key:'count',value:2});$('feedback').textContent='Cleared optional filters; two baseline filters remain.';}
  else if(action==='chip'){button.setAttribute('aria-pressed',String(button.getAttribute('aria-pressed')!=='true'));$('feedback').textContent=button.textContent+' selected.';}
  else $('feedback').textContent=({filter:'Filter action selected.',add:'New contact action selected.',deal:'New deal action selected.',save:'Changes saved in this local sketch.',open:'Deal action selected.'})[action]||'Action selected.';
 }
 const entity=event.target.closest('[data-probe]');if(entity){state.inspection[state.lab]=entity.id;syncInspectionOptions();queueProbe();}
});
$('preview-scroll').addEventListener('scroll',queueProbe,{passive:true});
window.addEventListener('resize',queueProbe);document.addEventListener('scroll',event=>{if($('fixture').contains(event.target))queueProbe();},{capture:true,passive:true});
new ResizeObserver(queueProbe).observe($('fixture'));
renderControls();renderFixture();syncScenario();syncControls();applyLayout();queueProbe();
</script>
